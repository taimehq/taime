# Declare our own workspace root so we are NOT absorbed by a parent
# Cargo.toml higher up the filesystem (e.g. ~/Cargo.toml). Without this,
# build-dependencies (tauri-build) get treated as a workspace key and ignored.
[workspace]

[package]
name = "taime"
version = "0.1.0"
description = "Taime — a unified app+terminal orchestrator for the official AI coding CLIs"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "taime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
dirs = "5"
# Async sleeps in the supervisor loop. Tauri's async_runtime is tokio-backed,
# so this is already in the dependency tree — we just declare it to link.
tokio = { version = "1", features = ["time"] }
# File watcher: native FS events + debouncing + gitignore-aware filtering.
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true
