# Taime session daemon: a long-lived, detached Rust binary that owns the PTY
# masters + an authoritative wezterm-term emulator and outlives the app.
[package]
name = "taime-session-daemon"
version = "0.1.0"
edition = "2021"
# 1.80 for std::sync::LazyLock (the provider-registry status regexes). The daemon
# already needs a recent toolchain for the git-pinned wezterm-term dep.
rust-version = "1.80"

[[bin]]
name = "taime-session-daemon"
path = "src/main.rs"

[dependencies]
taime-protocol = { path = "../taime-protocol" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
# Provider registry: serde_json for claude `--mcp-config` JSON + gemini
# settings.json merge; toml for `~/.taime/providers.toml` defaults; regex for the
# per-provider status/approval heuristics ported from CAO.
serde_json = "1"
toml = "0.8"
regex = "1"
# Durable orchestration store (Phase 3): SQLite via rusqlite in the app-data dir,
# schema mirroring CAO's so the Phase-7 import is a row copy. `bundled` compiles
# SQLite from source so the daemon is self-contained (no system libsqlite3 dep).
rusqlite = { version = "0.32", features = ["bundled"] }

portable-pty = "0.9"
anyhow = "1"
rand = "0.8"
subtle = "2"
dirs = "5"
# Schedules (cron-triggered unattended Agent/Workflow runs): saffron parses a
# 5-field POSIX cron string (Sun=0, so `1-5` = Mon–Fri, matching CAO) and computes
# the next fire time. chrono provides the wall clock.
saffron = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Per-session source-tree watcher (Phase 6 daemon-owned fs attribution): the
# daemon watches each agent's worktree, records change events to the store, and
# pushes dirty paths to the app. Same versions as the (retired) app-side watcher.
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"

# Authoritative headless emulator + (alternative) repaint renderer. Git-pinned,
# SAME rev for both, NOT crates.io (wezterm-term is unpublished; crates.io termwiz
# 0.23.3 would mismatch the in-tree 0.24.0 Line/surface types).
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Step 2.5 (deferred — uncomment when implementing zero-downtime fd handoff):
# sendfd = { version = "0.4.4", features = ["tokio"] }

[dev-dependencies]
taime-protocol = { path = "../taime-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
