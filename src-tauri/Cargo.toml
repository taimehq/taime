# Declare our own workspace root so we are NOT absorbed by a parent
# Cargo.toml higher up the filesystem (e.g. ~/Cargo.toml). Without this,
# build-dependencies (tauri-build) get treated as a workspace key and ignored.
#
# Members: the root package (`taime`, the Tauri app) is implicitly a member; the
# two new crates are the shared wire protocol and the detached session daemon.
# Build the app alone with `-p taime` so the heavy wezterm git dep (daemon-only)
# is not compiled into the app build.
[workspace]
members = ["crates/taime-protocol", "crates/taime-session-daemon"]

[package]
name = "taime"
version = "0.1.0"
description = "Taime — a unified app+terminal orchestrator for the official AI coding CLIs"
license = "FSL-1.1-ALv2"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "taime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Shared wire protocol with the session daemon (thin-client transport).
taime-protocol = { path = "crates/taime-protocol" }
# Async runtime (Tauri's async_runtime is tokio-backed). `net`/`io-util`/`sync`
# drive the Unix-socket client to the session daemon.
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
# (File watching moved into the session daemon — it owns the one watcher now.)

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true
